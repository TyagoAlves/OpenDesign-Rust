<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenDesign</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        user-select: none;
        -webkit-user-select: none;
      }
      .splash {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(120% 90% at 15% 0%, rgba(99, 102, 241, 0.35), transparent 55%),
          radial-gradient(90% 70% at 100% 100%, rgba(245, 158, 11, 0.18), transparent 50%),
          linear-gradient(160deg, #1e1b4b 0%, #17153a 55%, #0f1028 100%);
        border: 1px solid rgba(129, 140, 248, 0.18);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(5, 6, 20, 0.55);
      }
      .mark {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 10px 24px rgba(99, 102, 241, 0.35));
      }
      .wordmark {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #eef2ff;
        margin: 0;
      }
      .tag {
        margin: -8px 0 0;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a5b4fc;
      }
      .loader {
        margin-top: 6px;
        width: 160px;
        height: 4px;
        border-radius: 999px;
        background: rgba(129, 140, 248, 0.18);
        overflow: hidden;
        position: relative;
      }
      .loader::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 45%;
        border-radius: inherit;
        background: linear-gradient(90deg, #6366f1, #a78bfa, #f59e0b);
        animation: load 1.2s ease-in-out infinite;
      }
      @keyframes load {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader::after { animation: none; width: 100%; opacity: 0.75; }
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="Carregando OpenDesign">
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="OpenDesign">
        <rect width="180" height="180" rx="32" fill="#1e1b4b"/>
        <rect x="40" y="50" width="100" height="80" rx="8" fill="none" stroke="#818cf8" stroke-width="4"/>
        <rect x="50" y="60" width="35" height="25" rx="4" fill="#6366f1"/>
        <rect x="95" y="60" width="35" height="25" rx="4" fill="#a78bfa"/>
        <rect x="50" y="95" width="80" height="8" rx="4" fill="#4f46e5"/>
        <rect x="50" y="113" width="55" height="6" rx="3" fill="#6366f1" opacity="0.6"/>
        <circle cx="145" cy="45" r="16" fill="#f59e0b"/>
        <path d="M140 45 l5-8 l5 8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="145" y1="37" x2="145" y2="45" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <h1 class="wordmark">OpenDesign</h1>
      <p class="tag">Espaço de design visual</p>
      <div class="loader" aria-hidden="true"></div>
    </main>
  </body>
</html>
