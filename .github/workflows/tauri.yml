# ============================================================================
# OpenDesign — build desktop com Tauri 2 (WINDOWS FIRST)
# Apoio AG-08 (Manuela) · liderança: Renata
#
# STATUS: arquivo em rascunho no CAMINHO FINAL (.github/workflows/tauri.yml),
# dentro de OpenDesign/. NÃO foi commitado, pushado, tagueado nem publicado.
# OK explícito do Tyago é necessário para commitar/pushar (e, depois, tag/release).
#
# Edição da coordenação (20/11): separar build e bundle para que o exe embutido
# nos instaladores seja EXATAMENTE o exe que passou no gate. Sequência:
#   pnpm test → build cru → gate 1 (-FullAssetSet) → bundle MSI/NSIS
#   (--no-binary-patching --no-sign) → gate 2 + comparação de SHA → artefatos
#   → release RASCUNHO somente em push de tag v*.
# O tauri-action foi removido: ele faz build + bundle numa única chamada, sem
# deixar o gate rodar entre as duas etapas e sem --no-binary-patching.
#
# Decisões do Tyago (dúvida 7/8 do Douglas, 2026-11-20):
#   - MATRIX REDUZIDA A WINDOWS nesta rodada. macOS e Linux voltam depois, com
#     OK do Tyago. Não há Mac no time nem autorização para conta Apple
#     Developer/assinatura/notarização: nenhum segredo da Apple é usado aqui.
#   - INSTALADOR SÓ NO CI: o tauri.conf.json canônico de src-tauri/ NÃO muda
#     (bundle.active:false para o .exe cru local). Este job gera MSI + NSIS
#     com um override de config exclusivo do CI (src-tauri/ci-build.json).
#   - Gatilho inalterado: push em tag v* → release RASCUNHO (releaseDraft);
#     workflow_dispatch → dry-run, NENHUM release. Publish manual depois do QA
#     do Douglas e do OK explícito do Tyago. Nada disso é autorização para
#     criar/pushar tag ou publicar release agora.
#   - ASSINATURA DESLIGADA nesta rodada: `--no-sign` explícito no bundle, sem
#     secrets WINDOWS_*. O patching de binário também é desligado de propósito:
#     sem `--no-binary-patching` o bundler reescreve o exe in-place e o SHA-256
#     muda, reprovando o gate 2. Se o Tyago quiser assinar, isso entra num novo
#     ciclo de QA — não é alteração silenciosa dentro deste job.
# ============================================================================

name: Build desktop (Tauri — Windows)

on:
  # Release = tag v* (decisão do Tyago). O rascunho sai da tag.
  push:
    tags:
      - 'v*'

  # Manual = somente build de teste/dry-run, sem criar release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      # write é necessário para criar o rascunho de release no push de tag.
      # No disparo manual o token também tem write, mas nenhum release é criado.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # O projeto usa pnpm (pnpm-lock.yaml v9), NAO npm. @tauri-apps/cli já
      # está em devDependencies — não precisa "npm install --save-dev".
      - name: pnpm 12.21.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Mesma versão usada no QA local. O lockfile foi gerado por pnpm 12,
          # que não lê `pnpm.overrides` do package.json; com pnpm 10 o
          # --frozen-lockfile falha com ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
          version: 12.21.0
          run_install: false

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Instalar dependências do frontend
        run: pnpm install --frozen-lockfile

      # rust-version = 1.90 / edition 2024 no src-tauri/Cargo.toml.
      # Sem `targets`: só a arquitetura nativa do runner windows-latest.
      - name: Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # O workspace tem [profile.release] lto = true no Cargo.toml da raiz.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Testes (17/17)
        run: pnpm test

      # Override EXCLUSIVO DO CI: herda todo o tauri.conf.json canônico e
      # sobrescreve somente `bundle` (active:true + MSI/NSIS). O config local
      # permanece com active:false para o .exe cru. Nenhum secret é exportado
      # como variável vazia: o bundler usa var_os() e trataria "" como presente.
      - name: Preparar config de CI (instaladores MSI + NSIS)
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const bundle = {
            ...(base.bundle || {}),
            active: true,
            targets: ['msi', 'nsis'],
          };
          fs.writeFileSync('src-tauri/ci-build.json', JSON.stringify({ ...base, bundle }, null, 2) + '\n');
          NODE

          echo "Config de CI gerada: src-tauri/ci-build.json"
          grep -A6 '"bundle"' src-tauri/ci-build.json

      - name: Diagnóstico (melhor esforço)
        continue-on-error: true
        run: pnpm tauri info

      # UM único build cru: o beforeBuildCommand (pnpm build) regenera o dist/,
      # o Rust embute esse dist no target/release/app.exe. É a única vez em que
      # frontend + Rust são compilados neste job. Depois disso, só bundle.
      - name: Build cru (sem instalador)
        run: pnpm tauri build --no-bundle --config src-tauri/ci-build.json

      - name: Gate 1 — bundle embutido no exe cru
        id: gate1
        shell: pwsh
        run: |
          Write-Host '--- referencia do dist deste build ---'
          Select-String -Path dist/index.html -Pattern 'assets/index-[^"'']+\.js' | ForEach-Object { $_.Line.Trim() }
          pwsh -NoProfile -File scripts/check-embedded-bundle.ps1 -Exe target/release/app.exe -DistDir dist -FullAssetSet
          if ($LASTEXITCODE -ne 0) { throw 'Gate 1 reprovou o exe cru' }
          $sha = (Get-FileHash -LiteralPath target/release/app.exe -Algorithm SHA256).Hash
          # O SHA tambem vai para um arquivo no workspace: o gate 2 le daqui,
          # sem depender do contexto steps.<id>.outputs entre steps no runner.
          Set-Content -LiteralPath target/gate1.sha -Value $sha -Encoding ascii -NoNewline
          if (-not (Test-Path -LiteralPath target/gate1.sha)) { throw 'Falha ao gravar target/gate1.sha' }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "exe_sha=$sha`n")
          Write-Host "EXE_GATEADO_SHA256=$sha"

      # tauri bundle = "Generate bundles ... (already built by tauri build)".
      # Não há beforeBundleCommand na config, então o frontend não é reconstruído.
      # --no-binary-patching é OBRIGATÓRIO: sem ele o installer reescreve o PE
      # in-place e o SHA muda. --no-sign torna determinística a decisão de não
      # assinar nesta rodada.
      - name: Bundle MSI + NSIS (reaproveita o exe gateado)
        run: pnpm tauri bundle --bundles msi nsis --config src-tauri/ci-build.json --no-binary-patching --no-sign --ci

      - name: Gate 2 — exe inalterado após o bundle
        shell: pwsh
        run: |
          $expected = (Get-Content -LiteralPath target/gate1.sha -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($expected)) { throw 'SHA do gate 1 veio vazio de target/gate1.sha' }
          pwsh -NoProfile -File scripts/check-embedded-bundle.ps1 -Exe target/release/app.exe -DistDir dist -FullAssetSet
          if ($LASTEXITCODE -ne 0) { throw 'Gate 2 reprovou o exe após o bundle' }
          $after = (Get-FileHash -LiteralPath target/release/app.exe -Algorithm SHA256).Hash
          if ($after -cne $expected) {
            throw "O bundle reescreveu o exe: esperado $expected, encontrado $after"
          }
          Write-Host "EXE_POS_BUNDLE_SHA256=$after (identico ao gate 1)"

      # O Douglas confere o item 8 (exe extraído do instalador) localmente:
      # MSI: msiexec /a ... /qb TARGETDIR=... · NSIS: instalação silenciosa em
      # temp. Varrer MSI/NSIS comprimido é falso negativo e está vetado.
      - name: Upload artefatos (exe gateado + instaladores)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: opendesign-windows-${{ github.run_id }}
          path: |
            target/release/app.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Release RASCUNHO (somente push de tag v*)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $msi = @(Get-ChildItem -Path target/release/bundle/msi -Filter '*.msi' -File)
          $nsis = @(Get-ChildItem -Path target/release/bundle/nsis -Filter '*.exe' -File)
          if ($msi.Count -eq 0 -or $nsis.Count -eq 0) {
            throw "Instaladores ausentes: MSI=$($msi.Count) NSIS=$($nsis.Count)"
          }
          $files = @($msi.FullName) + @($nsis.FullName)
          $notes = 'Instaladores MSI e NSIS gerados no CI com build/bundle separados e gate de rastreabilidade. RASCUNHO — revisar QA do Douglas e obter OK do Tyago antes de publicar.'
          $ghArgs = @('release', 'create', $env:RELEASE_TAG) + $files + @(
            '--draft',
            '--title', "OpenDesign $env:RELEASE_TAG",
            '--notes', $notes
          )
          gh @ghArgs
